name: CareerOS CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/api/go.sum
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @career-os/web
      - run: npm run typecheck --workspace @career-os/employer
      - run: npm run typecheck --workspace @career-os/admin
      - run: npm test --workspace @career-os/web
      - run: npm run build --workspace @career-os/web
      - run: npm run build --workspace @career-os/employer
      - run: npm run build --workspace @career-os/admin
