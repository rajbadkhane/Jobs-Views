name = "jobs-view-api-edge"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# Free Cron Trigger: Pings Render every 10 minutes to eliminate cold starts forever!
[triggers]
crons = ["*/10 * * * *"]

# Environment Configuration
# Update BACKEND_ORIGIN if your exact Render app domain differs from below:
[vars]
BACKEND_ORIGIN = "https://jobs-view-api.onrender.com"
EDGE_CACHE_TTL = "180" # Seconds to cache public search queries at Cloudflare Edge (3 mins)
APP_ENV = "production"
CORS_ALLOW_ORIGINS = "https://jobsviews.com,https://www.jobsviews.com,https://jobs-view-web-rajbadkhar.vercel.app,https://jobs-view-admin-rajbadkhar.vercel.app,https://jobs-view-employer-rajbadkhar.vercel.app,https://jobs-view-web-rajbadkhar-raj-badkhane-s-projects.vercel.app,https://jobs-view-admin-rajbadkhar-raj-badkhane-s-projects.vercel.app,https://jobs-view-employer-rajbadkhar-raj-badkhane-s-projects.vercel.app"
JWT_ISSUER = "jobs-view-api"
MAIL_PROVIDER = "resend"
MAIL_FROM = "Jobs View <support@jobsviews.com>"
RAZORPAY_API_BASE_URL = "https://api.razorpay.com/v1"
RATE_LIMIT_MAX = "300"
SERVER_HOST = "0.0.0.0"
STORAGE_PROVIDER = "local"
STORAGE_BUCKET = "jobs-view-assets"


