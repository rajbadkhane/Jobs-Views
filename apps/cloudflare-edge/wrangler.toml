name = "jobs-view-api-edge"
main = "src/index.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Hyperdrive Native Edge Connection Pooler Binding
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "61143b5e6a1c460d89b2d47ac7309609"

# Cron Trigger: Keeps Supabase Postgres connection pool warm every 10 minutes (zero cold starts!)
[triggers]
crons = ["*/10 * * * *"]

# Non-sensitive environment variables only. DATABASE_URL, REDIS_URL,
# UPSTASH_REDIS_REST_URL/TOKEN, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, and
# SUPABASE_URL must NEVER be added here - they are encrypted Cloudflare
# secrets / dashboard-managed vars only. This file is committed to a public
# GitHub repo; anything placed in [vars] is plaintext and world-readable the
# moment it's pushed. See incident notes: these were previously committed
# here in cleartext and have since been rotated - do not reintroduce them.
[vars]
APP_ENV = "production"
EDGE_CACHE_TTL = "180" # Seconds to cache public search queries at Cloudflare Edge (3 mins)
CORS_ALLOW_ORIGINS = "https://jobsviews.com,https://www.jobsviews.com,https://admin.jobsviews.com,https://employer.jobsviews.com,https://jobs-view-web-rajbadkhar.vercel.app,https://jobs-view-admin-rajbadkhar.vercel.app,https://jobs-view-employer-rajbadkhar.vercel.app,https://jobs-view-web-rajbadkhar-raj-badkhane-s-projects.vercel.app,https://jobs-view-admin-rajbadkhar-raj-badkhane-s-projects.vercel.app,https://jobs-view-employer-rajbadkhar-raj-badkhane-s-projects.vercel.app"
JWT_ISSUER = "jobs-view-api-edge"
MAIL_PROVIDER = "resend"
MAIL_FROM = "Jobs View <support@jobsviews.com>"
RAZORPAY_API_BASE_URL = "https://api.razorpay.com/v1"
RATE_LIMIT_MAX = "300"
SERVER_HOST = "0.0.0.0"
STORAGE_PROVIDER = "cloudflare_r2"
STORAGE_BUCKET = "jobs-view-assets-prod"
